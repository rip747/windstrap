# Publishes WindStrap to the npm registry when a v* tag is pushed.
# jsDelivr and unpkg mirror npm automatically, so publishing here is what
# makes the framework available on those CDNs.
#
#   git tag v5.3.8-1 && git push origin v5.3.8-1
#
# Requires an npm automation token stored as a repository secret named NPM_TOKEN.
name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # needed for `npm publish --provenance`
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build dist (full + minified)
        run: npm run build

      - name: Publish to npm
        # --tag latest: WindStrap versions are prereleases (e.g. 5.3.8-1), and
        # npm tags prereleases as "next" by default, which a plain `npm i`
        # would not install. Forcing the latest tag keeps them installable.
        run: npm publish --provenance --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
