<h2 id="basic-example">Basic example <a class="anchor" href="#basic-example">#</a></h2>
<p>
  Use the included figure component to display an image with optional caption text.
</p>
<div class="bd-example">
  <figure class="figure">
    <svg class="bd-placeholder-img figure-img img-fluid rounded" width="400" height="300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Placeholder: 400x300" preserveAspectRatio="xMidYMid slice" focusable="false"><title>Placeholder</title><rect width="100%" height="100%" fill="#868e96"></rect><text x="50%" y="50%" fill="#dee2e6" dy=".3em">400x300</text></svg>
    <figcaption class="figure-caption">A caption for the above image.</figcaption>
  </figure>
</div>
<div class="bd-example-snippet">
  <div class="bd-clipboard"><button class="btn-clipboard" type="button">Copy</button></div>
  <pre class="highlight" data-escape><code>
<figure class="figure">
  <img src="..." class="figure-img img-fluid rounded" alt="...">
  <figcaption class="figure-caption">A caption for the above image.</figcaption>
</figure>
  </code></pre>
</div>

<h2 id="aligning">Aligning figure captions <a class="anchor" href="#aligning">#</a></h2>
<p>
  Use <a href="../utilities/text.html">text alignment utilities</a> to align the
  caption.
</p>
<div class="bd-example">
  <figure class="figure text-end">
    <svg class="bd-placeholder-img figure-img img-fluid rounded" width="400" height="300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Placeholder: 400x300" preserveAspectRatio="xMidYMid slice" focusable="false"><title>Placeholder</title><rect width="100%" height="100%" fill="#868e96"></rect><text x="50%" y="50%" fill="#dee2e6" dy=".3em">400x300</text></svg>
    <figcaption class="figure-caption">A caption for the above image.</figcaption>
  </figure>
</div>
<div class="bd-example-snippet">
  <div class="bd-clipboard"><button class="btn-clipboard" type="button">Copy</button></div>
  <pre class="highlight" data-escape><code>
<figure class="figure text-end">
  <img src="..." class="figure-img img-fluid rounded" alt="...">

</figure>
  </code></pre>
</div>
