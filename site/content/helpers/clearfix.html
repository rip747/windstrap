<h2 id="how-to-use">How to use <a class="anchor" href="#how-to-use">#</a></h2>
<p>
  Add the <code>.clearfix</code> class to clear <code>float</code>s. It uses the
  <code>::after</code> pseudo-element with <code>content: ""</code> and
  <code>clear: both</code>. This is useful when mixing floated content with
  non-floated content.
</p>
<div class="bd-example">
  <div class="bg-light clearfix">
    <button type="button" class="btn btn-secondary float-start">Example Button floated left</button>
    <button type="button" class="btn btn-secondary float-end">Example Button floated right</button>
  </div>
</div>
<div class="bd-example-snippet">
  <div class="bd-clipboard"><button class="btn-clipboard" type="button">Copy</button></div>
  <pre class="highlight" data-escape><code>

</div>
  </code></pre>
</div>
