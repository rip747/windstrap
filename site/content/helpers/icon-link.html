<h2 id="icon-link">Icon link <a class="anchor" href="#icon-link">#</a></h2>
<p>
  Build on the <code>.link-*</code> helper to quickly create styled links with a
  leading icon and an arrow that shifts on hover.
</p>
<div class="bd-example">
  <a class="icon-link icon-link-hover" href="#">
    <svg class="bi" aria-hidden="true"><use xlink:href="#arrow-right"></use></svg>
    Icon link
  </a>
</div>

  <div class="bd-clipboard"><button class="btn-clipboard" type="button">Copy</button></div>

</a>
  </code></pre>
</div>
