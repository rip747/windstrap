<h2 id="examples">Examples <a class="anchor" href="#examples">#</a></h2>
<p>
  Add or remove shadows to elements with the <code>.shadow-*</code> utilities.
</p>
<div class="bd-example">
  <div class="shadow-none p-3 mb-3 bg-body-tertiary rounded-2">No shadow</div>
  <div class="shadow-sm p-3 mb-3 bg-body-tertiary rounded-2">Small shadow</div>
  <div class="shadow p-3 mb-3 bg-body-tertiary rounded-2">Regular shadow</div>
  <div class="shadow-lg p-3 mb-3 bg-body-tertiary rounded-2">Larger shadow</div>
</div>
<div class="bd-example-snippet">
  <div class="bd-clipboard"><button class="btn-clipboard" type="button">Copy</button></div>
  <pre class="highlight" data-escape><code>
<div class="shadow-none p-3 mb-3 bg-body-tertiary rounded-2">No shadow</div>
<div class="shadow-sm p-3 mb-3 bg-body-tertiary rounded-2">Small shadow</div>
<div class="shadow p-3 mb-3 bg-body-tertiary rounded-2">Regular shadow</div>
<div class="shadow-lg p-3 mb-3 bg-body-tertiary rounded-2">Larger shadow</div>
  </code></pre>
</div>
