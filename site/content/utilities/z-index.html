<h2 id="example">Example <a class="anchor" href="#example">#</a></h2>
<p>
  Use the <code>.z-*</code> utilities to control the stacking order of elements.
  These utilities set the <code>z-index</code> property.
</p>
<div class="bd-example">
  <div class="position-relative">
    <div class="position-absolute z-3 p-2 bg-primary text-white rounded-2" style="width: 200px; height: 80px;">z-3</div>
    <div class="position-absolute z-2 p-2 bg-success text-white rounded-2" style="width: 160px; height: 60px; left: 30px; top: 10px;">z-2</div>
    <div class="position-absolute z-1 p-2 bg-danger text-white rounded-2" style="width: 120px; height: 40px; left: 60px; top: 20px;">z-1</div>
    <div class="position-absolute z-0 p-2 bg-dark text-white rounded-2" style="width: 80px; height: 20px; left: 90px; top: 30px;">z-0</div>
  </div>
</div>
<div class="bd-example-snippet">
  <div class="bd-clipboard"><button class="btn-clipboard" type="button">Copy</button></div>
  <pre class="highlight" data-escape><code>
<div class="position-relative">
  <div class="position-absolute z-3">…</div>
  <div class="position-absolute z-2">…</div>
  <div class="position-absolute z-1">…</div>
  <div class="position-absolute z-0">…</div>
</div>
  </code></pre>
</div>
