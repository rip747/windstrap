<h2 id="example">Example <a class="anchor" href="#example">#</a></h2>
<p>
  The <code>.opacity-*</code> utilities set the <code>opacity</code> of an element.
</p>
<div class="bd-example">
  <div class="opacity-100 p-3 bg-primary text-white rounded-2 mb-2">Opacity 100%</div>
  <div class="opacity-75 p-3 bg-primary text-white rounded-2 mb-2">Opacity 75%</div>
  <div class="opacity-50 p-3 bg-primary text-white rounded-2 mb-2">Opacity 50%</div>
  <div class="opacity-25 p-3 bg-primary text-white rounded-2 mb-2">Opacity 25%</div>
  <div class="opacity-0 p-3 bg-primary text-white rounded-2">Opacity 0%</div>
</div>
